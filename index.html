<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b1d0e">
<title>Classic Rhythm Tap</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#2b1d0e;overscroll-behavior:none}
body{font-family:Georgia,'Times New Roman',serif;color:#1b1209;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;display:flex;justify-content:center;align-items:center}
#game{position:relative;width:100vw;height:100vh;height:100dvh;max-width:1000px;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;display:flex;justify-content:space-between;align-items:center;pointer-events:none;font-weight:bold;font-size:17px}
#pauseBtn{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:2px solid #8b6b3d;background:#fffaf0cc;font-size:18px;color:#1b1209}
.overlay{position:absolute;inset:0;background:rgba(247,239,217,.97);display:flex;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.panel{margin:auto;width:100%;max-width:420px;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.hidden{display:none!important}
.title{font-size:28px;font-weight:bold;color:#5a3e1b;font-style:italic}
.sub{font-family:sans-serif;font-size:14px;color:#8b6b3d}
h3{font-family:sans-serif;font-size:14px;color:#8b6b3d;margin-top:6px}
.group{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.opt{background:#fffaf0;border:2px solid #d8c39a;color:#1b1209;padding:11px 10px;border-radius:10px;font-size:15px;font-family:Georgia,serif;flex:1 1 40%}
.opt.active{border-color:#8b5a2b;background:#f0dcb0;font-weight:bold}
#lenList .opt{flex:1 1 28%}
#diffDesc{font-family:sans-serif;font-size:13px;color:#5a3e1b;background:#fffaf0;border:1px dashed #d8c39a;border-radius:8px;padding:8px 10px;width:100%}
.checks{display:flex;flex-direction:column;gap:8px;font-family:sans-serif;font-size:15px;text-align:left;width:100%}
.checks input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin-right:6px;accent-color:#8b5a2b}
.checks input[type=range]{width:100%;accent-color:#8b5a2b}
.btn{background:#8b5a2b;color:#fffaf0;border:none;padding:14px 36px;border-radius:12px;font-size:19px;font-weight:bold;font-family:sans-serif}
.btn.sec{background:#d8c39a;color:#1b1209}
.small{font-family:sans-serif;font-size:13px;color:#8b6b3d}
#legend{width:320px;height:90px;max-width:100%}
#grade{font-size:84px;font-weight:bold;color:#8b5a2b;font-style:italic;line-height:1}
.stats{font-family:sans-serif;line-height:1.9;font-size:16px}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <div id="hud" class="hidden"><span id="score">0</span><button id="pauseBtn">⏸</button><span id="acc">100%</span></div>

  <div id="menu" class="overlay"><div class="panel">
    <div class="title">♫ Classic Rhythm Tap ♫</div>
    <div class="sub">แตะให้ตรงจังหวะ · โน้ตสุ่มใหม่ทุกรอบ</div>
    <canvas id="legend"></canvas>
    <h3>ระดับความยาก</h3>
    <div class="group" id="diffList"></div>
    <div id="diffDesc"></div>
    <h3>ความยาว</h3>
    <div class="group" id="lenList"></div>
    <div class="checks">
      <label><input type="checkbox" id="metro" checked>เสียงเมโทรนอม (ช่วยนับจังหวะ)</label>
      <label><input type="checkbox" id="showName" checked>แสดงชื่อโน้ต (โด เร มี)</label>
      <label><input type="checkbox" id="vib" checked>สั่นเมื่อแตะโดน</label>
      <label>ปรับดีเลย์: <b id="offVal">0</b> ms
        <input type="range" id="offset" min="-200" max="200" step="10" value="0"></label>
    </div>
    <div class="small" id="best"></div>
    <button class="btn" id="startBtn">▶ เริ่มเล่น</button>
    <div class="small" id="hint"></div>
  </div></div>

  <div id="pauseMenu" class="overlay hidden"><div class="panel">
    <div class="title">⏸ พักเกม</div>
    <button class="btn" id="resumeBtn">▶ เล่นต่อ</button>
    <button class="btn sec" id="restartBtn">🔁 สุ่มใหม่</button>
    <button class="btn sec" id="quitBtn">🏠 เมนู</button>
  </div></div>

  <div id="result" class="overlay hidden"><div class="panel">
    <div class="title" id="resTitle">ผลการเล่น</div>
    <div id="grade">S</div>
    <div class="stats" id="resStats"></div>
    <button class="btn" id="retryBtn">🎲 เล่นอีกครั้ง (จังหวะใหม่)</button>
    <button class="btn sec" id="menuBtn">🏠 เมนู</button>
  </div></div>
</div>

<script>
const $=id=>document.getElementById(id);

// ============ ระดับความยาก: cells = กลุ่มจังหวะยาว 1 หรือ 2 จังหวะ (ค่าติดลบ = ตัวหยุด) ============
const DIFFS={
  easy:{name:'😊 ง่าย',bpm:80,K:7,perfect:0.10,good:0.18,
    desc:'ตัวดำ · ตัวขาว · ตัวหยุด — 80 BPM',
    cells:[[1],[1],[1],[1],[2],[2],[-1],[1,1]]},
  normal:{name:'😎 ปกติ',bpm:100,K:7,perfect:0.07,good:0.13,
    desc:'+ เขบ็ต 1 ชั้น · ตัวดำประจุด · หยุดครึ่งจังหวะ — 100 BPM',
    cells:[[1],[1],[0.5,0.5],[0.5,0.5],[2],[1.5,0.5],[-0.5,0.5],[-1]]},
  hard:{name:'🔥 ยาก',bpm:115,K:8,perfect:0.05,good:0.10,
    desc:'+ เขบ็ต 2 ชั้น · เขบ็ตประจุด · จังหวะขัด — 115 BPM',
    cells:[[1],[0.5,0.5],[0.25,0.25,0.25,0.25],[0.75,0.25],[0.5,0.25,0.25],[0.25,0.25,0.5],[-0.5,0.5],[0.5,1,0.5],[1.5,0.5],[-0.25,0.25,0.5]]},
  expert:{name:'💀 เทพ',bpm:130,K:8.5,perfect:0.045,good:0.09,
    desc:'เขบ็ต 2 ชั้นถี่ ๆ · หยุดแทรก · จังหวะขัดซับซ้อน — 130 BPM',
    cells:[[0.25,0.25,0.25,0.25],[0.25,0.25,0.25,0.25],[0.75,0.25],[0.25,0.75],[0.25,0.5,0.25],[0.5,0.25,0.25],[0.25,0.25,0.5],
           [-0.25,0.25,-0.25,0.25],[-0.25,0.25,0.25,0.25],[-0.5,0.25,0.25],[0.5,1,0.5],[0.5,0.5]]}
};
const LENGTHS={
  short:{name:'สั้น\n8 ห้อง',bars:8},
  mid:{name:'กลาง\n16 ห้อง',bars:16},
  long:{name:'ยาว\n32 ห้อง',bars:32}
};

const INK='#1b1209',PAPER='#fffaf0',GOLD='#b8860b',WOOD='#8b5a2b',RED='#c0392b';
const SOLFEGE={C:'โด',D:'เร',E:'มี',F:'ฟา',G:'ซอล',A:'ลา',B:'ที'};
const isTouch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;

// ============ สถานะ ============
let selDiff='normal',selLen='mid',diff,items=[],notes=[],groups=[],chartEnd=0,spb=0.5;
let actx,master,startPerf=0,pauseAt=0,resumeAt=0,playing=false,paused=false,wakeLock=null,nextBeat=0;
let score=0,combo=0,maxCombo=0,cntP=0,cntG=0,cntM=0,cntEarly=0,cntLate=0;
let optName=true,optVib=true,optMetro=true,offsetSec=0;
let judgeText='',judgeSub='',judgeColor=INK,judgeTime=-1e9,lastTap=-1e9;
const effects=[];

// ============ หน้าจอ ============
const cv=$('cv'),ctx=cv.getContext('2d');
let W,H,s,midY,hitX,bx,by,br;
function resize(){
  W=$('game').clientWidth;H=$('game').clientHeight;
  const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  s=Math.max(9,Math.min(18,H*0.022));
  midY=H*0.42;
  hitX=Math.max(s*5,W*0.2);
  br=Math.min(70,W*0.18,H*0.16);bx=W/2;by=H-br-28;
}
resize();
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,250));
const yOf=st=>midY-(st-34)*s/2;   // step 34 = B4 (เส้นกลาง)

// ============ เสียง ============
function midiOf(n){
  const m=n.match(/^([A-G])(#|b)?(\d)$/);
  return 12*(+m[3]+1)+{C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);
}
const stepOf=n=>(+n[n.length-1])*7+'CDEFGAB'.indexOf(n[0]);
const freqOf=m=>440*Math.pow(2,(m-69)/12);

function initAudio(){
  if(!actx){
    actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain();master.gain.value=0.6;master.connect(actx.destination);
    const b=actx.createBuffer(1,1,22050),src=actx.createBufferSource();
    src.buffer=b;src.connect(actx.destination);src.start(0);
  }
  if(actx.state!=='running')actx.resume();
}
function playTone(midi,dur){
  const f=freqOf(midi),now=actx.currentTime,g=actx.createGain();
  g.gain.setValueAtTime(0,now);
  g.gain.linearRampToValueAtTime(0.4,now+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,now+dur+0.6);
  g.connect(master);
  [['triangle',1,1],['sine',2,0.25],['sine',3,0.1]].forEach(([type,mul,v])=>{
    const o=actx.createOscillator(),og=actx.createGain();
    o.type=type;o.frequency.value=f*mul;og.gain.value=v;
    o.connect(og);og.connect(g);o.start(now);o.stop(now+dur+0.7);
  });
}
function click(at,accent,vol){
  const o=actx.createOscillator(),g=actx.createGain();
  o.frequency.value=accent?1500:1000;
  g.gain.setValueAtTime(0.0001,at);
  g.gain.exponentialRampToValueAtTime(vol,at+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,at+0.07);
  o.connect(g);g.connect(master);o.start(at);o.stop(at+0.09);
}

// ============ ชนิดตัวโน้ต/ตัวหยุด ============
function noteType(b){
  if(b>=4)return{kind:'whole',dot:false};
  if(b>=3)return{kind:'half',dot:true};
  if(b>=2)return{kind:'half',dot:false};
  if(b>=1.5)return{kind:'quarter',dot:true};
  if(b>=1)return{kind:'quarter',dot:false};
  if(b>=0.75)return{kind:'eighth',dot:true};
  if(b>=0.5)return{kind:'eighth',dot:false};
  return{kind:'sixteenth',dot:false};
}

// หัวโน้ต + จุด
function drawHead(c,x,y,kind,dot,s,color){
  c.save();c.fillStyle=c.strokeStyle=color;
  const rx=s*0.62,ry=s*0.44;
  c.save();c.translate(x,y);c.rotate(-0.35);c.beginPath();
  if(kind==='whole'){c.lineWidth=s*0.22;c.ellipse(0,0,rx*1.05,ry*0.82,0.3,0,Math.PI*2);c.stroke();}
  else if(kind==='half'){c.lineWidth=s*0.16;c.ellipse(0,0,rx*0.9,ry*0.8,0,0,Math.PI*2);c.stroke();}
  else{c.ellipse(0,0,rx,ry,0,0,Math.PI*2);c.fill();}
  c.restore();
  if(dot){c.beginPath();c.arc(x+rx+s*0.45,y-s*0.22,s*0.17,0,Math.PI*2);c.fill();}
  c.restore();
}

// ตัวโน้ตเดี่ยว (มีก้านและหางของตัวเอง)
function drawNote(c,x,y,kind,dot,s,down,color){
  drawHead(c,x,y,kind,dot,s,color);
  if(kind==='whole')return;
  c.save();c.fillStyle=c.strokeStyle=color;c.lineCap='round';
  const rx=s*0.62,sx=down?x-rx*0.88:x+rx*0.88,tip=down?y+s*3.4:y-s*3.4;
  c.lineWidth=Math.max(1.3,s*0.11);
  c.beginPath();c.moveTo(sx,y);c.lineTo(sx,tip);c.stroke();
  const flags=kind==='eighth'?1:kind==='sixteenth'?2:0;
  if(flags){
    c.translate(sx,tip);c.scale(1,down?-1:1);
    for(let f=0;f<flags;f++){
      const o=f*s*0.75;
      c.beginPath();c.moveTo(0,o);
      c.bezierCurveTo(s*0.25,o+s*0.8,s*1.3,o+s*1.0,s*0.85,o+s*2.1);
      c.bezierCurveTo(s*1.0,o+s*1.3,s*0.45,o+s*1.1,0,o+s*0.9);
      c.closePath();c.fill();
    }
  }
  c.restore();
}

function drawRest(c,x,y,kind,dot,s,color){
  c.save();c.fillStyle=c.strokeStyle=color;c.lineCap='round';c.lineJoin='round';
  if(kind==='whole')c.fillRect(x-s*0.55,y-s,s*1.1,s*0.5);
  else if(kind==='half')c.fillRect(x-s*0.55,y-s*0.5,s*1.1,s*0.5);
  else if(kind==='quarter'){
    c.lineWidth=s*0.22;c.beginPath();
    c.moveTo(x-s*0.2,y-s*1.5);c.lineTo(x+s*0.35,y-s*0.75);c.lineTo(x-s*0.2,y-s*0.05);
    c.lineTo(x+s*0.3,y+s*0.6);c.quadraticCurveTo(x-s*0.6,y+s*0.35,x,y+s*1.3);c.stroke();
  }else{
    c.lineWidth=s*0.13;
    c.beginPath();c.arc(x-s*0.2,y-s*0.5,s*0.2,0,Math.PI*2);c.fill();
    c.beginPath();c.moveTo(x-s*0.2,y-s*0.35);c.quadraticCurveTo(x+s*0.1,y-s*0.25,x+s*0.35,y-s*0.75);
    c.lineTo(x-s*0.05,y+(kind==='sixteenth'?s*1.4:s*0.9));c.stroke();
    if(kind==='sixteenth'){
      c.beginPath();c.arc(x-s*0.35,y+s*0.1,s*0.2,0,Math.PI*2);c.fill();
      c.beginPath();c.moveTo(x-s*0.35,y+s*0.25);c.quadraticCurveTo(x-s*0.05,y+s*0.35,x+s*0.2,y-s*0.15);c.stroke();
    }
  }
  if(dot){c.beginPath();c.arc(x+s*0.75,y-s*0.25,s*0.17,0,Math.PI*2);c.fill();}
  c.restore();
}

function drawLedgers(x,st){
  ctx.strokeStyle=INK;ctx.lineWidth=1.4;
  for(let k=28;k>=st;k-=2){ctx.beginPath();ctx.moveTo(x-s,yOf(k));ctx.lineTo(x+s,yOf(k));ctx.stroke();}
  for(let k=40;k<=st;k+=2){ctx.beginPath();ctx.moveTo(x-s,yOf(k));ctx.lineTo(x+s,yOf(k));ctx.stroke();}
}

const colOf=it=>it.state===1?GOLD:it.state===2?RED:INK;

// ============ วาดกลุ่มเขบ็ตที่เชื่อมด้วยคาน ============
function drawGroup(g,now,speed){
  const m=g.members,n=m.length,dir=g.down?1:-1,rx=s*0.62;
  const sx=m.map(it=>hitX+(it.t-now)*speed+(g.down?-rx*0.88:rx*0.88));
  const ys=m.map(it=>yOf(it.step));
  const lv=m.map(it=>it.beats<0.5?2:1);
  const bt=s*0.42,gap=s*0.72;
  const minL=s*2.5+(lv.includes(2)?gap:0);
  const span=Math.max(1,sx[n-1]-sx[0]);
  const slope=Math.max(-s,Math.min(s,ys[n-1]-ys[0]))/span;   // ความชันไม่เกิน 1 ช่องบรรทัด
  let y0=ys[0]+dir*s*3.3;
  for(let i=0;i<n;i++){                                       // ก้านทุกตัวต้องยาวพอ
    const len=dir*(y0+slope*(sx[i]-sx[0])-ys[i]);
    if(len<minL)y0+=dir*(minL-len);
  }
  const beamY=x=>y0+slope*(x-sx[0]);

  // ก้าน
  ctx.lineCap='butt';ctx.lineWidth=Math.max(1.3,s*0.11);
  m.forEach((it,i)=>{
    ctx.globalAlpha=it.state===2?0.45:1;ctx.strokeStyle=colOf(it);
    ctx.beginPath();ctx.moveTo(sx[i],ys[i]);ctx.lineTo(sx[i],beamY(sx[i]));ctx.stroke();
  });
  ctx.globalAlpha=1;

  // คาน
  ctx.fillStyle=m.every(it=>it.state===1)?GOLD:INK;
  const hw=ctx.lineWidth/2;
  const seg=(xa,xb,off)=>{
    ctx.beginPath();
    ctx.moveTo(xa,beamY(xa)-dir*off);ctx.lineTo(xb,beamY(xb)-dir*off);
    ctx.lineTo(xb,beamY(xb)-dir*(off+bt));ctx.lineTo(xa,beamY(xa)-dir*(off+bt));
    ctx.closePath();ctx.fill();
  };
  seg(sx[0]-hw,sx[n-1]+hw,0);                                  // คานหลัก (เขบ็ต 1 ชั้น)
  for(let i=0;i<n;i++){                                        // คานชั้นที่ 2 (เขบ็ต 2 ชั้น)
    if(lv[i]<2)continue;
    if(i+1<n&&lv[i+1]===2){seg(sx[i]-hw,sx[i+1]+hw,gap);continue;}
    if(i>0&&lv[i-1]===2)continue;
    if(i===0){const L=Math.min(s*1.1,(sx[1]-sx[0])*0.5);seg(sx[0]-hw,sx[0]+L,gap);}
    else{const L=Math.min(s*1.1,(sx[i]-sx[i-1])*0.5);seg(sx[i]-L,sx[i]+hw,gap);}
  }
}

// ============ สุ่มโน้ต ============
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sum=a=>a.reduce((x,y)=>x+Math.abs(y),0);

function randomChart(bars){
  const scale=['C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F5','G5'];
  let i=4;const seq=[];
  const next=()=>{i=Math.max(0,Math.min(scale.length-1,i+Math.floor(Math.random()*5)-2));return scale[i];};
  for(let bar=0;bar<bars;bar++){
    if(bar===0){for(let k=0;k<4;k++)seq.push({n:next(),d:1});continue;}
    if(bar===bars-1){seq.push({n:pick(['C4','E4','G4','C5']),d:2},{n:'R',d:2});break;}
    let rem=4;
    while(rem>1e-6){
      const pos=Math.round(4-rem);
      // กลุ่ม 2 จังหวะต้องเริ่มที่จังหวะ 1 หรือ 3 เท่านั้น (ไม่คร่อมกลางห้อง)
      const ok=diff.cells.filter(c=>sum(c)<=rem+1e-6&&(sum(c)<2||pos%2===0));
      const cell=ok.length?pick(ok):[1];
      for(const d of cell)seq.push(d<0?{n:'R',d:-d}:{n:next(),d});
      rem-=sum(cell);
    }
  }
  return seq;
}

function buildGroups(){
  groups=[];let cur=null,pos=0;
  const close=()=>{
    if(cur&&cur.members.length>1){
      const st=cur.members.map(it=>it.step);
      cur.down=(Math.max(...st)-34)>(34-Math.min(...st));     // ทิศก้านทั้งกลุ่มเหมือนกัน
      cur.members.forEach(it=>it.group=cur);
      groups.push(cur);
    }
    cur=null;
  };
  for(const it of items){
    const b=Math.floor(pos+1e-6);
    const ok=!it.rest&&it.beats<1&&pos+it.beats<=b+1+1e-6;    // เขบ็ตที่อยู่ในจังหวะเดียวกัน
    if(ok&&cur&&cur.beat===b)cur.members.push(it);
    else{close();if(ok)cur={beat:b,members:[it]};}
    pos+=it.beats;
  }
  close();
}

function buildChart(){
  const seq=randomChart(LENGTHS[selLen].bars);
  spb=60/diff.bpm;
  let t=0;items=[];
  for(const x of seq){
    const it={t,beats:x.d,dur:x.d*spb,rest:x.n==='R',state:0,group:null,...noteType(x.d)};
    if(!it.rest){
      it.name=x.n;it.midi=midiOf(x.n);it.step=stepOf(x.n);
      it.acc=x.n[1]==='#'?'♯':x.n[1]==='b'?'♭':'';
    }
    items.push(it);t+=x.d*spb;
  }
  chartEnd=t;notes=items.filter(i=>!i.rest);
  buildGroups();
}

// ============ ควบคุมเกม ============
const songTime=()=>playing?((paused?pauseAt:performance.now())-startPerf)/1000:0;
async function requestWake(){try{wakeLock=await navigator.wakeLock?.request('screen');}catch(e){}}
function releaseWake(){try{wakeLock?.release();}catch(e){}wakeLock=null;}
function show(id,v){$(id).classList.toggle('hidden',!v);}
const bestKey=()=>'crt5_'+selDiff+'_'+selLen;

function startGame(){
  initAudio();document.activeElement?.blur();
  diff=DIFFS[selDiff];
  optName=$('showName').checked;optVib=$('vib').checked;optMetro=$('metro').checked;
  offsetSec=+$('offset').value/1000;
  buildChart();
  score=combo=maxCombo=cntP=cntG=cntM=cntEarly=cntLate=0;judgeText='';effects.length=0;
  const lead=4*spb+0.3;
  startPerf=performance.now()+lead*1000;
  for(let k=0;k<4;k++)click(actx.currentTime+0.3+k*spb,k===0,0.4);
  nextBeat=0;playing=true;paused=false;resumeAt=0;
  show('menu',0);show('result',0);show('pauseMenu',0);show('hud',1);
  updateHud();requestWake();
  const de=document.documentElement;
  if(isTouch&&de.requestFullscreen&&!document.fullscreenElement)de.requestFullscreen().catch(()=>{});
}
function pauseGame(){
  if(!playing)return;
  if(paused){if(resumeAt){resumeAt=0;show('pauseMenu',1);}return;}
  paused=true;pauseAt=performance.now();resumeAt=0;show('pauseMenu',1);
}
function resumeGame(){
  if(!paused||resumeAt)return;
  show('pauseMenu',0);initAudio();
  resumeAt=performance.now()+3*spb*1000;
  for(let k=0;k<3;k++)click(actx.currentTime+k*spb,k===0,0.4);
  requestWake();
}
function toMenu(){
  playing=false;paused=false;resumeAt=0;releaseWake();
  show('hud',0);show('pauseMenu',0);show('result',0);show('menu',1);buildMenu();
}
function endGame(){
  playing=false;releaseWake();show('hud',0);
  const total=notes.length,acc=total?(cntP+cntG*0.5)/total*100:0;
  const grade=acc>=95?'S':acc>=90?'A':acc>=80?'B':acc>=70?'C':'D';
  const best=+(localStorage.getItem(bestKey())||0),isNew=score>best;
  if(isNew)localStorage.setItem(bestKey(),score);
  $('grade').textContent=grade;
  $('resTitle').textContent=isNew?'🏆 สถิติใหม่!':'ผลการเล่น';
  $('resStats').innerHTML=`${diff.name} · ${LENGTHS[selLen].name.replace('\n',' ')}<br>
    คะแนน: <b>${score}</b><br>ความแม่นยำ: <b>${acc.toFixed(1)}%</b><br>คอมโบสูงสุด: <b>${maxCombo}</b> / ${total}<br>
    <span style="color:${GOLD}">PERFECT ${cntP}</span> · <span style="color:#1e8449">GOOD ${cntG}</span> · <span style="color:${RED}">MISS ${cntM}</span><br>
    <span style="font-size:14px;color:#8b6b3d">แตะเร็วไป ${cntEarly} ครั้ง · ช้าไป ${cntLate} ครั้ง</span>`;
  show('result',1);
}
function judge(t,c,sub=''){judgeText=t;judgeColor=c;judgeSub=sub;judgeTime=performance.now();}
function updateHud(){
  $('score').textContent=score;
  const done=cntP+cntG+cntM;
  $('acc').textContent=(done?(cntP+cntG*0.5)/done*100:100).toFixed(1)+'%';
}
function miss(n,sub){
  n.state=2;cntM++;combo=0;judge('MISS',RED,sub);
  if(sub==='เร็วไป')cntEarly++;else cntLate++;
}

function hitTap(){
  lastTap=performance.now();
  if(!playing||paused)return;
  const now=songTime()-offsetSec,win=diff.good*2;
  let best=null;
  for(const n of notes){
    if(n.t-now>win)break;
    if(n.state)continue;
    const d=Math.abs(n.t-now);
    if(d<=win&&(!best||d<Math.abs(best.t-now)))best=n;
  }
  if(!best)return;
  const dt=now-best.t,d=Math.abs(dt),sub=dt<0?'เร็วไป':'ช้าไป';
  if(d<=diff.good){
    best.state=1;combo++;maxCombo=Math.max(maxCombo,combo);
    const mult=1+Math.floor(combo/10)*0.1;
    if(d<=diff.perfect){cntP++;score+=Math.round(300*mult);judge('PERFECT',GOLD);}
    else{
      cntG++;score+=Math.round(100*mult);judge('GOOD','#1e8449',sub);
      if(dt<0)cntEarly++;else cntLate++;
    }
    playTone(best.midi,Math.min(best.dur,0.8));
    if(optVib&&navigator.vibrate)navigator.vibrate(15);
    effects.push({y:yOf(best.step),time:performance.now(),perfect:d<=diff.perfect});
  }else miss(best,sub);
  updateHud();
}

// ============ วาดเกม ============
function loop(){
  const p=performance.now();
  if(paused&&resumeAt&&p>=resumeAt){startPerf+=resumeAt-pauseAt;paused=false;resumeAt=0;}
  const now=songTime(),jnow=now-offsetSec,speed=diff.K*s/spb;

  if(playing&&!paused&&optMetro){
    while(nextBeat*spb<=now+0.12&&nextBeat*spb<=chartEnd){
      const bt=nextBeat*spb;
      if(bt>=now-0.02)click(actx.currentTime+Math.max(0,bt-now),nextBeat%4===0,0.12);
      nextBeat++;
    }
  }
  if(playing&&!paused)for(const n of notes){
    if(n.t-jnow>0)break;
    if(n.state===0&&jnow-n.t>diff.good){miss(n,'ช้าไป');updateHud();}
  }

  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#f7efd9');bg.addColorStop(1,'#e8d5ad');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // แถบตี
  const tapGlow=Math.max(0,1-(p-lastTap)/150);
  ctx.fillStyle=`rgba(184,134,11,${0.16+tapGlow*0.3})`;
  ctx.fillRect(hitX-s*0.9,yOf(44),s*1.8,yOf(24)-yOf(44));
  ctx.strokeStyle=GOLD;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(hitX,yOf(44));ctx.lineTo(hitX,yOf(24));ctx.stroke();

  if(playing){
    // เส้นกั้นห้อง
    ctx.strokeStyle=INK;
    for(let k=Math.max(1,Math.floor(now/(4*spb)));k*4*spb<=chartEnd+1e-6;k++){
      const x=hitX+(k*4*spb-now)*speed-s*0.9;
      if(x>W+5)break;
      const last=Math.abs(k*4*spb-chartEnd)<1e-6;
      ctx.lineWidth=last?4:1.5;
      ctx.beginPath();ctx.moveTo(x,yOf(38));ctx.lineTo(x,yOf(30));ctx.stroke();
      if(last){ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x-6,yOf(38));ctx.lineTo(x-6,yOf(30));ctx.stroke();}
    }
    // ตัวโน้ต + ตัวหยุด
    for(const it of items){
      const x=hitX+(it.t-now)*speed;
      if(x>W+s*3)break;
      if(x<-s*3)continue;
      if(it.rest){ctx.globalAlpha=0.6;drawRest(ctx,x,midY,it.kind,it.dot,s,INK);ctx.globalAlpha=1;continue;}
      const y=yOf(it.step),col=colOf(it);
      ctx.globalAlpha=it.state===2?0.45:1;
      drawLedgers(x,it.step);
      if(it.group)drawHead(ctx,x,y,it.kind,it.dot,s,col);           // ก้านและคานวาดทีหลังทั้งกลุ่ม
      else drawNote(ctx,x,y,it.kind,it.dot,s,it.step>=34,col);
      ctx.textAlign='center';ctx.textBaseline='middle';
      if(it.acc){ctx.fillStyle=col;ctx.font=`bold ${s*1.5}px serif`;ctx.fillText(it.acc,x-s*1.5,y);}
      if(optName){ctx.fillStyle=WOOD;ctx.font=`bold ${Math.max(11,s*0.8)}px sans-serif`;ctx.fillText(SOLFEGE[it.name[0]],x,yOf(19));}
      ctx.globalAlpha=1;
    }
    // กลุ่มเขบ็ต (ก้าน + คาน)
    for(const g of groups){
      const m=g.members;
      if(hitX+(m[0].t-now)*speed>W+s*3)break;
      if(hitX+(m[m.length-1].t-now)*speed<-s*3)continue;
      drawGroup(g,now,speed);
    }
  }

  const fade=ctx.createLinearGradient(0,0,hitX-s,0);
  fade.addColorStop(0,'rgba(240,226,195,.95)');fade.addColorStop(1,'rgba(240,226,195,.55)');
  ctx.fillStyle=fade;ctx.fillRect(0,yOf(50),hitX-s,yOf(17)-yOf(50));

  // บรรทัด 5 เส้น + 4/4
  ctx.strokeStyle=INK;ctx.lineWidth=1.2;
  for(const st of [30,32,34,36,38]){ctx.beginPath();ctx.moveTo(0,yOf(st));ctx.lineTo(W,yOf(st));ctx.stroke();}
  ctx.fillStyle=INK;ctx.font=`bold ${s*2.1}px Georgia`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('4',hitX-s*2.8,yOf(36));ctx.fillText('4',hitX-s*2.8,yOf(32));

  // จุดนับจังหวะ
  if(playing&&now>=0){
    const bi=Math.floor(now/spb),ph=now/spb-bi;
    for(let k=0;k<4;k++){
      ctx.fillStyle=k===bi%4?`rgba(139,90,43,${1-ph*0.7})`:'rgba(139,90,43,.2)';
      ctx.beginPath();ctx.arc(W/2+(k-1.5)*s*1.6,yOf(48.5),s*(k===0?0.42:0.32),0,Math.PI*2);ctx.fill();
    }
  }

  // เอฟเฟกต์
  for(let i=effects.length-1;i>=0;i--){
    const e=effects[i],q=(p-e.time)/450;
    if(q>1){effects.splice(i,1);continue;}
    const col=e.perfect?GOLD:'#1e8449';
    ctx.globalAlpha=1-q;ctx.strokeStyle=col;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(hitX,e.y,s*0.9+q*s*2.2,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=col;ctx.font=`bold ${s*1.6}px serif`;ctx.textAlign='center';
    ctx.fillText('♪',hitX+s+q*s*2,e.y-s-q*s*3);
    ctx.globalAlpha=1;
  }

  // ข้อความตัดสิน
  ctx.textAlign='center';ctx.textBaseline='middle';
  const jp=(p-judgeTime)/650;
  if(playing&&jp<1&&judgeText){
    ctx.globalAlpha=1-jp;ctx.fillStyle=judgeColor;
    ctx.font=`italic bold ${s*1.9+(1-jp)*5}px Georgia`;ctx.fillText(judgeText,W/2,yOf(55));
    if(judgeSub){ctx.font=`bold ${s*0.9}px sans-serif`;ctx.fillText(judgeSub,W/2,yOf(55)+s*1.4);}
    ctx.globalAlpha=1;
  }
  let cd=0;
  if(playing&&!paused&&now<0)cd=Math.min(4,Math.ceil(-now/spb));
  if(paused&&resumeAt)cd=Math.ceil((resumeAt-p)/1000/spb);
  if(cd>0){ctx.fillStyle='rgba(27,18,9,.8)';ctx.font=`italic bold ${s*4}px Georgia`;ctx.fillText(cd,W/2,yOf(55));}

  // ปุ่มตบ
  const pr=p-lastTap<110,r=br*(pr?0.92:1);
  ctx.fillStyle=WOOD;ctx.beginPath();ctx.arc(bx,by,r,0,Math.PI*2);ctx.fill();
  const face=ctx.createRadialGradient(bx-r*0.2,by-r*0.25,r*0.1,bx,by,r*0.85);
  face.addColorStop(0,PAPER);face.addColorStop(1,pr?'#f3d27a':'#e8d5ad');
  ctx.fillStyle=face;ctx.beginPath();ctx.arc(bx,by,r*0.84,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=INK;ctx.font=`bold ${r*0.42}px Georgia`;
  ctx.fillText('ตบ!',bx,by-(playing&&combo>=3?r*0.12:0));
  if(playing&&combo>=3){ctx.fillStyle=WOOD;ctx.font=`bold ${r*0.2}px sans-serif`;ctx.fillText(combo+' COMBO',bx,by+r*0.32);}

  if(playing){
    ctx.fillStyle=WOOD;ctx.fillRect(0,0,W*Math.max(0,Math.min(1,now/chartEnd)),4);
    if(!paused&&now>chartEnd+1&&notes.every(n=>n.state))endGame();
  }
  requestAnimationFrame(loop);
}

// ============ การควบคุม ============
cv.addEventListener('pointerdown',e=>{e.preventDefault();hitTap();},{passive:false});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){paused?resumeGame():pauseGame();return;}
  if(!playing||e.repeat)return;
  if(e.key===' '||e.key==='Enter'||e.key.length===1){e.preventDefault();hitTap();}
});
addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame();});

// ============ เมนู ============
function buildOptions(id,data,get,set){
  const box=$(id);box.innerHTML='';
  for(const k in data){
    const b=document.createElement('button');
    b.className='opt'+(get()===k?' active':'');
    b.innerHTML=data[k].name.replace('\n','<br><small>')+(data[k].name.includes('\n')?'</small>':'');
    b.onclick=()=>{set(k);buildMenu();};box.appendChild(b);
  }
}
function buildMenu(){
  buildOptions('diffList',DIFFS,()=>selDiff,v=>selDiff=v);
  buildOptions('lenList',LENGTHS,()=>selLen,v=>selLen=v);
  diff=DIFFS[selDiff];
  $('diffDesc').textContent=diff.desc;
  const best=localStorage.getItem(bestKey());
  $('best').textContent=best?`🏆 คะแนนสูงสุด: ${best}`:'ยังไม่มีสถิติในโหมดนี้';
}
function drawLegend(){
  const lc=$('legend'),c=lc.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);
  lc.width=320*dpr;lc.height=90*dpr;c.setTransform(dpr,0,0,dpr,0,0);
  [['whole','ตัวกลม','4'],['half','ตัวขาว','2'],['quarter','ตัวดำ','1'],['eighth','เขบ็ต 1 ชั้น','½'],['sixteenth','เขบ็ต 2 ชั้น','¼']]
  .forEach(([k,label,b],i)=>{
    const x=32+i*64;
    drawNote(c,x-4,50,k,false,9,false,INK);
    c.fillStyle='#5a3e1b';c.textAlign='center';c.font='bold 11px sans-serif';
    c.fillText(label,x,72);c.font='10px sans-serif';c.fillText(b+' จังหวะ',x,86);
  });
}
const off=$('offset');
off.value=localStorage.getItem('crt_offset')||0;$('offVal').textContent=off.value;
off.oninput=()=>{$('offVal').textContent=off.value;localStorage.setItem('crt_offset',off.value);};
$('hint').textContent=isTouch?'แตะตรงไหนบนจอก็ได้ เมื่อตัวโน้ตถึงแถบสีทอง':'กด Space / คลิกจอ เมื่อตัวโน้ตถึงแถบสีทอง · Esc = พัก';
drawLegend();buildMenu();requestAnimationFrame(loop);
$('startBtn').onclick=startGame;
$('retryBtn').onclick=startGame;
$('restartBtn').onclick=()=>{paused=false;startGame();};
$('menuBtn').onclick=toMenu;
$('quitBtn').onclick=toMenu;
$('resumeBtn').onclick=resumeGame;
$('pauseBtn').onclick=pauseGame;
</script>
</body>
